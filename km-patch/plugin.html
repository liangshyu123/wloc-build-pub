<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>插件下发 · 卡密后台</title>
<style>
  :root{--bg:#f5f6fa;--card:#fff;--line:#e6e8f0;--txt:#1f2430;--sub:#7a8194;--pri:#2a5bff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,"PingFang SC",Arial,sans-serif}
  .wrap{max-width:620px;margin:0 auto;padding:18px}
  h1{font-size:19px;margin:6px 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
  input[type=text],input[type=number],select{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px;background:#fff}
  input[type=file]{width:100%;font-size:13px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .btn{display:block;width:100%;height:46px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:600;margin-top:16px}
  .btn[disabled]{opacity:.5}
  .hint{font-size:12px;color:var(--sub);margin-top:8px}
  .st{margin-top:12px;font-size:13px;white-space:pre-wrap}
  .ok{color:#1a9c5b}.err{color:#d64545}
</style></head><body>
<div class="wrap">
  <h1>插件下发</h1>

  <div class="card">
    <label>选择应用</label>
    <select id="app"></select>
    <label>启动延迟（秒）</label>
    <input type="number" id="delay" value="3" min="0" max="120">
    <label>版本号</label>
    <input type="text" id="ver" value="1.0">
    <label>状态</label>
    <select id="enabled"><option value="1">启用</option><option value="0">禁用</option></select>
    <label>插件文件（.dylib，≤3MB）</label>
    <input type="file" id="file" accept=".dylib,.so,.bin">
    <button class="btn" id="save">保存并上传</button>
    <div class="hint">上传后 App 启动会拉取配置 → 下载 → 延迟 N 秒 → dlopen 加载。需要 TrollStore 或越狱环境。</div>
    <div class="st" id="st"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const token = localStorage.getItem('km_token') || '';
const say = (msg, cls) => { const el = $('st'); el.className = 'st ' + (cls || ''); el.textContent = msg; };
const api = async (p, opt = {}) => {
  const r = await fetch(p, { ...opt, headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}), ...(opt.headers || {}) } });
  const j = await r.json().catch(() => ({ ok: false, error: { message: '响应异常' } }));
  if (!j.ok) throw new Error((j.error && j.error.message) || '请求失败');
  return j.data;
};

let apps = [];
async function boot() {
  if (!token) { say('未登录：请先回到后台首页登录一次，再打开本页。', 'err'); return; }
  try {
    apps = await api('/api/admin/apps?t=' + Date.now());
    $('app').innerHTML = apps.map(a => `<option value="${a.id}">${a.name}（${a.appKey}）</option>`).join('');
    await loadOne();
  } catch (e) { say('加载应用失败：' + e.message, 'err'); }
}

async function loadOne() {
  const id = $('app').value;
  if (!id) return;
  try {
    const d = await api('/api/admin/plugin?appId=' + encodeURIComponent(id) + '&t=' + Date.now());
    const p = d.plugin || {};
    $('delay').value = p.delay == null ? 3 : p.delay;
    $('ver').value = p.version || '1.0';
    $('enabled').value = p.enabled ? '1' : '0';
    say(p.size ? `当前插件：${(p.size / 1024).toFixed(0)} KB · v${p.version || '1.0'}` : '当前没有插件文件');
  } catch (e) { say('读取失败：' + e.message, 'err'); }
}

$('app').onchange = loadOne;

$('save').onclick = async () => {
  const id = $('app').value;
  if (!id) return;
  const f = $('file').files[0];
  $('save').disabled = true;
  say('处理中…');
  try {
    let data = '';
    if (f) {
      if (f.size > 3 * 1024 * 1024) throw new Error('文件超过 3MB');
      data = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(String(fr.result).split(',')[1] || '');
        fr.onerror = () => rej(new Error('读取文件失败'));
        fr.readAsDataURL(f);
      });
    }
    const body = { appId: Number(id), enabled: $('enabled').value === '1', delay: Number($('delay').value) || 0, version: $('ver').value.trim() || '1.0' };
    if (data) body.data = data;
    const out = await api('/api/admin/plugin', { method: 'POST', body: JSON.stringify(body) });
    say(`已保存 · v${out.version} · 延迟 ${out.delay}s · ${out.size ? (out.size / 1024).toFixed(0) + ' KB' : '无文件'} · ${out.enabled ? '已启用' : '已禁用'}`, 'ok');
  } catch (e) {
    say('保存失败：' + e.message, 'err');
  } finally {
    $('save').disabled = false;
  }
};

boot();
</script></body></html>
