name: build-ipa

# Windows 上出未签名 IPA 的正路：借 GitHub 的 macOS runner 编。
# 触发：仓库 → Actions → 左侧 build-ipa → Run workflow
#
# 与旧 build.yml 的区别（旧的那个必然失败，别再跑）：
#   1. 旧版没跑 generate_apple_wloc_p12.sh，Resources/iOS/AppWLocProxy.p12 等
#      三个文件不存在，而 project.pbxproj 引用了它们 → Build input file cannot be found。
#   2. 旧版用 macos-14，你的账号会被映射成付费大机型 → configuration not supported。
#   3. 旧版没写 entitlements，TrollStore 装完 VPN 隧道是死的。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    # macos-13 是免费额度里唯一稳定的 intel runner（macos-14/15 在部分账号上会报
    # configuration not supported）。排队慢是常态，挂着等即可。
    runs-on: macos-13
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境自检
        run: |
          set -x
          xcodebuild -version
          which pod || gem install cocoapods --no-document
          pod --version
          openssl version
          sw_vers

      - name: 生成代理证书（必须先跑，否则资源缺失编译失败）
        run: |
          set -euo pipefail
          chmod +x ./generate_apple_wloc_p12.sh
          # 有 OpenSSL 3 就用它（3DES 需 -legacy）；没有就让系统 LibreSSL 上，
          # 脚本内部已按能力探测降级。
          if command -v brew >/dev/null 2>&1; then
            if [ -x "$(brew --prefix openssl@3 2>/dev/null)/bin/openssl" ]; then
              export PATH="$(brew --prefix openssl@3)/bin:$PATH"
            fi
          fi
          openssl version
          ./generate_apple_wloc_p12.sh --platform ios --force
          ls -l Resources/iOS/AppWLocRootCA.cer Resources/iOS/AppWLocProxy.p12 Resources/Tunnel/AppWLocProxy.p12

      - name: Pod install
        run: |
          set -euo pipefail
          pod install --repo-update || pod install

      - name: 编译（未签名）
        run: |
          set -o pipefail
          xcodebuild -workspace WLocApp.xcworkspace -scheme WLocApp-iOS \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            | tail -120

      - name: 打 entitlements + 打 IPA
        run: |
          set -euo pipefail
          APP="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)"
          echo "APP=$APP"
          test -d "$APP/PlugIns/WLocTunnel-iOS.appex" || { echo "✗ 隧道扩展没编出来"; exit 1; }

          # TrollStore 需要 entitlements 真的写进 Mach-O，否则 VPN/隧道起不来
          command -v ldid >/dev/null 2>&1 || brew install ldid
          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          ldid -S"Resources/iOS/WLocApp-iOS.entitlements" "$APP/$EXEC"
          for APPEX in "$APP"/PlugIns/*.appex; do
            [ -d "$APPEX" ] || continue
            E="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist")"
            ldid -S"Resources/Tunnel/WLocTunnel-iOS.entitlements" "$APPEX/$E"
          done
          ldid -e "$APP/$EXEC" | head -30

          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry wloc-ipa.ipa Payload
          ls -lh wloc-ipa.ipa
          du -sh "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wloc-ipa
          path: wloc-ipa.ipa
          if-no-files-found: error
          retention-days: 14
