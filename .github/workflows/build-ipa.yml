name: build-ipa

# Windows 涓婂嚭鏈鍚?IPA 鐨勬璺細鍊?GitHub 鐨?macOS runner 缂栥€?# 瑙﹀彂锛氫粨搴?鈫?Actions 鈫?宸︿晶 build-ipa 鈫?Run workflow
#
# 涓庢棫 build.yml 鐨勫尯鍒紙鏃х殑閭ｄ釜蹇呯劧澶辫触锛屽埆鍐嶈窇锛夛細
#   1. 鏃х増娌¤窇 generate_apple_wloc_p12.sh锛孯esources/iOS/AppWLocProxy.p12 绛?#      涓変釜鏂囦欢涓嶅瓨鍦紝鑰?project.pbxproj 寮曠敤浜嗗畠浠?鈫?Build input file cannot be found銆?#   2. 鏃х増鐢?macos-14锛屼綘鐨勮处鍙蜂細琚槧灏勬垚浠樿垂澶ф満鍨?鈫?configuration not supported銆?#   3. 鏃х増娌″啓 entitlements锛孴rollStore 瑁呭畬 VPN 闅ч亾鏄鐨勩€?
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    # macos-13 鏄厤璐归搴﹂噷鍞竴绋冲畾鐨?intel runner锛坢acos-14/15 鍦ㄩ儴鍒嗚处鍙蜂笂浼氭姤
    # configuration not supported锛夈€傛帓闃熸參鏄父鎬侊紝鎸傜潃绛夊嵆鍙€?    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 鐜鑷
        run: |
          set -x
          xcodebuild -version
          which pod || gem install cocoapods --no-document
          pod --version
          openssl version
          sw_vers

      - name: 鐢熸垚浠ｇ悊璇佷功锛堝繀椤诲厛璺戯紝鍚﹀垯璧勬簮缂哄け缂栬瘧澶辫触锛?        run: |
          set -euo pipefail
          chmod +x ./generate_apple_wloc_p12.sh
          # 鏈?OpenSSL 3 灏辩敤瀹冿紙3DES 闇€ -legacy锛夛紱娌℃湁灏辫绯荤粺 LibreSSL 涓婏紝
          # 鑴氭湰鍐呴儴宸叉寜鑳藉姏鎺㈡祴闄嶇骇銆?          if command -v brew >/dev/null 2>&1; then
            if [ -x "$(brew --prefix openssl@3 2>/dev/null)/bin/openssl" ]; then
              export PATH="$(brew --prefix openssl@3)/bin:$PATH"
            fi
          fi
          openssl version
          ./generate_apple_wloc_p12.sh --platform ios --force
          ls -l Resources/iOS/AppWLocRootCA.cer Resources/iOS/AppWLocProxy.p12 Resources/Tunnel/AppWLocProxy.p12

      - name: Pod install
        run: |
          set -euo pipefail
          pod install --repo-update || pod install

      - name: 缂栬瘧锛堟湭绛惧悕锛?        run: |
          set -o pipefail
          xcodebuild -workspace WLocApp.xcworkspace -scheme WLocApp-iOS \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            | tail -120

      - name: 鎵?entitlements + 鎵?IPA
        run: |
          set -euo pipefail
          APP="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)"
          echo "APP=$APP"
          test -d "$APP/PlugIns/WLocTunnel-iOS.appex" || { echo "鉁?闅ч亾鎵╁睍娌＄紪鍑烘潵"; exit 1; }

          # TrollStore 闇€瑕?entitlements 鐪熺殑鍐欒繘 Mach-O锛屽惁鍒?VPN/闅ч亾璧蜂笉鏉?          command -v ldid >/dev/null 2>&1 || brew install ldid
          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          ldid -S"Resources/iOS/WLocApp-iOS.entitlements" "$APP/$EXEC"
          for APPEX in "$APP"/PlugIns/*.appex; do
            [ -d "$APPEX" ] || continue
            E="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist")"
            ldid -S"Resources/Tunnel/WLocTunnel-iOS.entitlements" "$APPEX/$E"
          done
          ldid -e "$APP/$EXEC" | head -30

          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry wloc-ipa.ipa Payload
          ls -lh wloc-ipa.ipa
          du -sh "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"

      - name: 涓婁紶浜х墿
        uses: actions/upload-artifact@v4
        with:
          name: wloc-ipa
          path: wloc-ipa.ipa
          if-no-files-found: error
          retention-days: 14
