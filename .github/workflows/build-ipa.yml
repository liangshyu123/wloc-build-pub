name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'
      - 'generate_apple_wloc_p12.sh'
      - 'Podfile'
      - 'Podfile.lock'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Env info
        run: |
          set -x
          xcodebuild -version
          sw_vers
          which pod || gem install cocoapods --no-document
          pod --version
          openssl version

      - name: Generate proxy certificates
        run: |
          set -euo pipefail
          chmod +x ./generate_apple_wloc_p12.sh
          if command -v brew >/dev/null 2>&1; then
            if [ -x "$(brew --prefix openssl@3 2>/dev/null)/bin/openssl" ]; then
              export PATH="$(brew --prefix openssl@3)/bin:$PATH"
            fi
          fi
          openssl version
          ./generate_apple_wloc_p12.sh --platform ios --force
          ls -l Resources/iOS/AppWLocRootCA.cer Resources/iOS/AppWLocProxy.p12 Resources/Tunnel/AppWLocProxy.p12

      - name: Pod install
        run: |
          set -euo pipefail
          pod install --repo-update || pod install

      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild -workspace WLocApp.xcworkspace -scheme WLocApp-iOS \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            | tail -120

      - name: Entitlements and package IPA
        run: |
          set -euo pipefail
          APP="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)"
          echo "APP=$APP"
          test -d "$APP/PlugIns/WLocTunnel-iOS.appex" || { echo "tunnel appex missing"; exit 1; }
          command -v ldid >/dev/null 2>&1 || brew install ldid
          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          ldid -S"Resources/iOS/WLocApp-iOS.entitlements" "$APP/$EXEC"
          for APPEX in "$APP"/PlugIns/*.appex; do
            [ -d "$APPEX" ] || continue
            E="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist")"
            ldid -S"Resources/Tunnel/WLocTunnel-iOS.entitlements" "$APPEX/$E"
          done
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry wloc-ipa.ipa Payload
          ls -lh wloc-ipa.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wloc-ipa
          path: wloc-ipa.ipa
          if-no-files-found: error
          retention-days: 14
